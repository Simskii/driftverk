<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser · Driftverk</title>
<link rel="stylesheet" href="viewer.css">
<body>
  <header class="toolbar">
    <div class="identity">
      <span class="browser-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg></span>
      <div class="identity-copy">
        <div class="title"><strong>Driftverk</strong><span class="title-divider" aria-hidden="true">/</span><span id="view-name">Browser</span></div>
        <p id="hint">Pause your agent before taking control.</p>
      </div>
    </div>
    <div class="toolbar-controls">
      <span class="connection-status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status">Connecting…</span></span>
      <nav aria-label="Browser controls">
        <button id="control" class="control-button" aria-describedby="hint" aria-pressed="false" disabled>
          <svg class="pointer-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 9-7 1-3 7-4-17Z"/></svg>
          <svg class="watch-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="button-label">Take control</span>
        </button>
        <div class="utility-controls">
          <button id="reconnect" class="icon-button" aria-label="Reconnect" data-tooltip="Reconnect">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.2A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.8"/></svg>
          </button>
          <button id="fullscreen" class="icon-button" aria-label="Full screen" data-tooltip="Full screen">
            <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
            <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5"/></svg>
          </button>
        </div>
      </nav>
    </div>
  </header>
  <main id="screen" aria-label="Remote browser"></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
