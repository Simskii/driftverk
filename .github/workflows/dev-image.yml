name: Development image

on:
  pull_request:
    paths: ['images/dev/**', 'scripts/third-party-image.sh', '.github/workflows/dev-image.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (YYYY.MM.N)'
        required: true
        default: '2026.09.1'
      publish:
        description: 'Publish the verified release to GHCR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker build -t driftverk-dev:test images/dev
      - uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93
        with:
          image: driftverk-dev:test
          format: spdx-json
          syft-version: v1.54.1
          artifact-name: dev-${{ matrix.runner }}.spdx.json
      - name: Export installed third-party legal files
        run: sh scripts/third-party-image.sh driftverk-dev:test dev-third-party-notices.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-third-party-notices-${{ matrix.runner }}
          path: dev-third-party-notices.tar
          if-no-files-found: error
      - name: Verify tools and on-demand Docker
        # This checks nested Docker functionality, not the Sysbox isolation boundary.
        run: |
          container=$(docker run -d --privileged -v /var/lib/docker \
            -v "$PWD/images/dev/compose-smoke.sh:/tmp/compose-smoke.sh:ro" driftverk-dev:test)
          trap 'docker rm -f -v "$container"' EXIT
          docker exec "$container" /usr/local/bin/driftverk-dev-smoke
          docker exec "$container" sh /tmp/compose-smoke.sh
          docker stop "$container"
          docker start "$container"
          docker exec "$container" sh /tmp/compose-smoke.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infrastructure/compute-agent/package-lock.json
      - run: npm ci --prefix infrastructure/compute-agent
      - name: Verify desktop lifecycle and recordings
        env:
          DRIFTVERK_TEST_IMAGE: driftverk-dev:test
        run: |
          python3 images/dev/desktop/lifecycle_test.py
          python3 images/dev/desktop/smoke.py
          python3 images/dev/desktop/idle_smoke.py
          python3 images/dev/desktop/recording_smoke.py

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Publish versioned multi-platform image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]
          image="ghcr.io/${GHCR_OWNER,,}/dev"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$image:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release tag already exists. Choose a new version.' >&2
            exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push --sbom=true --provenance=true \
            --tag "$image:$RELEASE_VERSION" --metadata-file /tmp/dev-image.json images/dev
          digest=$(jq -r '."containerimage.digest"' /tmp/dev-image.json)
          echo "Published $image@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo 'Retain the published digest, attestations and license archives. Register this digest using control-plane/scripts/register-system-snapshot.mjs.' >> "$GITHUB_STEP_SUMMARY"
