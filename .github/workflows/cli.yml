name: CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Test CLI
        working-directory: cli
        run: go test ./...
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./cli/test-windows-install.ps1
      - name: Build native CLI
        working-directory: cli
        run: go build -o driftverk${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Smoke test native CLI
        working-directory: cli
        shell: bash
        run: ./driftverk version

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build all supported binaries, checksums, and upstream notices
        run: sh cli/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driftverk-cli
          path: control-plane/installer/bin/
          if-no-files-found: error
